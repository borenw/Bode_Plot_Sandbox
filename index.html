<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bode Plot Sandbox</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Space+Grotesk:wght@300;500;700&display=swap');

  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #d0d5e0;
    --accent-gain: #0077cc;
    --accent-phase: #e05000;
    --pole-color: #cc1144;
    --zero-color: #1a8c00;
    --text: #1a1d24;
    --text-dim: #7a8499;
    --grid: #e8eaf0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    height: 100vh;
    display: grid;
    grid-template-rows: 44px 1fr;
    grid-template-columns: 280px 1fr;
    overflow: hidden;
  }

  header {
    grid-column: 1 / -1;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
  }

  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #1a1d24;
  }

  .tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 2px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .tag-gain { background: rgba(0,119,204,0.1); color: var(--accent-gain); border: 1px solid rgba(0,119,204,0.3); }
  .tag-phase { background: rgba(224,80,0,0.1); color: var(--accent-phase); border: 1px solid rgba(224,80,0,0.3); }

  .header-right {
    margin-left: auto;
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 11px;
    color: var(--text-dim);
  }

  .kbd { background: var(--border); border-radius: 3px; padding: 1px 6px; color: var(--text); }

  /* Sidebar */
  aside {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-section {
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
  }

  .sidebar-label {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .pz-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 220px;
    overflow-y: auto;
  }

  .pz-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    font-size: 11px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .pz-item:hover { border-color: #a0aabb; }
  .pz-item.selected { border-color: #0077cc; background: #e8f4ff; }

  .pz-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .pz-dot.pole { background: var(--pole-color); box-shadow: 0 0 4px rgba(204,17,68,0.4); }
  .pz-dot.zero { background: var(--zero-color); box-shadow: 0 0 4px rgba(26,140,0,0.4); }

  .pz-freq { color: var(--text); font-weight: 600; flex: 1; }
  .pz-type { color: var(--text-dim); font-size: 10px; }

  .pz-delete {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0 2px;
    transition: color 0.15s;
  }
  .pz-delete:hover { color: #cc1144; }

  .add-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 10px;
  }

  .btn {
    padding: 7px 0;
    border-radius: 4px;
    border: 1px solid;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .btn-pole {
    background: rgba(204,17,68,0.06);
    border-color: rgba(204,17,68,0.5);
    color: var(--pole-color);
  }
  .btn-pole:hover { background: rgba(204,17,68,0.14); }

  .btn-zero {
    background: rgba(26,140,0,0.06);
    border-color: rgba(26,140,0,0.4);
    color: var(--zero-color);
  }
  .btn-zero:hover { background: rgba(26,140,0,0.12); }

  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }

  .input-row label { font-size: 10px; color: var(--text-dim); min-width: 28px; }

  .freq-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 5px 8px;
    outline: none;
  }
  .freq-input:focus { border-color: #0077cc; }

  .unit-select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 5px 6px;
    outline: none;
    cursor: pointer;
  }

  /* gain / DC info */
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .info-cell {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
  }

  .info-cell-label { font-size: 9px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px; }
  .info-cell-val { font-size: 13px; font-weight: 600; }

  .gain-color { color: var(--accent-gain); }
  .phase-color { color: var(--accent-phase); }

  /* Cursor freq */
  .cursor-info {
    padding: 10px 16px;
    font-size: 11px;
    color: var(--text-dim);
  }
  #cursor-display { color: var(--text); font-weight: 600; }

  /* Main plot area */
  main {
    display: grid;
    grid-template-rows: 1fr 1fr;
    padding: 16px;
    gap: 12px;
    overflow: hidden;
    position: relative;
  }

  .plot-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .plot-title {
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .plot-title span { width: 20px; height: 2px; display: inline-block; border-radius: 1px; }

  canvas {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #ffffff;
    width: 100%;
    flex: 1;
    display: block;
  }

  /* Tooltip */
  #tooltip {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 11px;
    pointer-events: none;
    display: none;
    z-index: 100;
  }

  .scrollbar-thin::-webkit-scrollbar { width: 4px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #c0c8d8; border-radius: 2px; }

  .empty-state { color: var(--text-dim); font-size: 11px; text-align: center; padding: 16px 0; }

  .gain-input-row { margin-top: 8px; display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>

<header>
  <h1>Bode Plot Sandbox</h1>
  <span class="tag tag-gain">Gain</span>
  <span class="tag tag-phase">Phase</span>
  <div class="header-right">
    <span>Click plot to place</span>
    <span class="kbd">P</span> Pole &nbsp;
    <span class="kbd">Z</span> Zero &nbsp;
    <span class="kbd">Del</span> Remove
  </div>
</header>

<aside>
  <div class="sidebar-section">
    <div class="sidebar-label">Poles &amp; Zeros</div>
    <div class="pz-list scrollbar-thin" id="pz-list">
      <div class="empty-state">No poles or zeros yet.<br>Click the plot or use buttons below.</div>
    </div>
    <div class="add-btns">
      <button class="btn btn-pole" onclick="addFromSidebar('pole')">＋ Pole</button>
      <button class="btn btn-zero" onclick="addFromSidebar('zero')">＋ Zero</button>
    </div>
    <div class="input-row">
      <label>freq</label>
      <input class="freq-input" id="add-freq" type="number" value="1000" step="any" placeholder="Hz">
      <select class="unit-select" id="add-unit">
        <option value="1">Hz</option>
        <option value="1000">kHz</option>
        <option value="1000000">MHz</option>
      </select>
    </div>
    <div class="gain-input-row">
      <label style="font-size:10px;color:var(--text-dim);min-width:28px">K</label>
      <input class="freq-input" id="dc-gain" type="number" value="1" step="any" placeholder="DC gain">
    </div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-label">At Cursor</div>
    <div id="cursor-display" style="font-size:12px;padding:4px 0">—</div>
  </div>

  <div class="sidebar-section" style="flex:1">
    <div class="sidebar-label">System Info</div>
    <div class="info-grid">
      <div class="info-cell">
        <div class="info-cell-label">Poles</div>
        <div class="info-cell-val" id="info-poles">0</div>
      </div>
      <div class="info-cell">
        <div class="info-cell-label">Zeros</div>
        <div class="info-cell-val" id="info-zeros">0</div>
      </div>
      <div class="info-cell">
        <div class="info-cell-label">DC Gain</div>
        <div class="info-cell-val gain-color" id="info-dcgain">0 dB</div>
      </div>
      <div class="info-cell">
        <div class="info-cell-label">Phase Margin</div>
        <div class="info-cell-val phase-color" id="info-pm">—</div>
      </div>
    </div>
  </div>
</aside>

<main>
  <div class="plot-wrap">
    <div class="plot-title">
      <span style="background:var(--accent-gain)"></span>
      Gain (dB)
    </div>
    <canvas id="gain-canvas"></canvas>
  </div>
  <div class="plot-wrap">
    <div class="plot-title">
      <span style="background:var(--accent-phase)"></span>
      Phase (°)
    </div>
    <canvas id="phase-canvas"></canvas>
  </div>
</main>

<div id="tooltip"></div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
const state = {
  poles: [],   // { id, freq }  freq in Hz
  zeros: [],
  selected: null,
  mode: null,  // 'pole' | 'zero' | null (click-to-place mode)
  fMin: 1,
  fMax: 1e7,
  cursorX: null,
  gainPoint: { freq: 1, gainDb: 0 },   // fixed at 1Hz, drag vertically to set DC gain
  gainPointSelected: false,
};

let idCounter = 0;
const newId = () => ++idCounter;

// ─── Frequency range (log) ────────────────────────────────────────────────────
const logFMin = () => Math.log10(state.fMin);
const logFMax = () => Math.log10(state.fMax);
const freqFromX = (x, W) => Math.pow(10, logFMin() + (x / W) * (logFMax() - logFMin()));
const xFromFreq = (f, W) => ((Math.log10(f) - logFMin()) / (logFMax() - logFMin())) * W;

// ─── Transfer function ────────────────────────────────────────────────────────
function evalTF(f) {
  const K = parseFloat(document.getElementById('dc-gain').value) || 1;
  const w = 2 * Math.PI * f;
  let numRe = K, numIm = 0;
  let denRe = 1, denIm = 0;

  for (const z of state.zeros) {
    const wz = 2 * Math.PI * z.freq;
    // factor: (jw/wz + 1) => re = 1, im = w/wz
    const re = 1, im = w / wz;
    const newRe = numRe * re - numIm * im;
    const newIm = numRe * im + numIm * re;
    numRe = newRe; numIm = newIm;
  }

  for (const p of state.poles) {
    const wp = 2 * Math.PI * p.freq;
    const re = 1, im = w / wp;
    const newRe = denRe * re - denIm * im;
    const newIm = denRe * im + denIm * re;
    denRe = newRe; denIm = newIm;
  }

  // H = num / den
  const denom = denRe * denRe + denIm * denIm;
  const hRe = (numRe * denRe + numIm * denIm) / denom;
  const hIm = (numIm * denRe - numRe * denIm) / denom;
  const mag = Math.sqrt(hRe * hRe + hIm * hIm);
  const phase = Math.atan2(hIm, hRe) * 180 / Math.PI;
  return { gainDb: 20 * Math.log10(mag), phase };
}

// ─── Canvas setup ─────────────────────────────────────────────────────────────
const gainCanvas = document.getElementById('gain-canvas');
const phaseCanvas = document.getElementById('phase-canvas');
const gainCtx = gainCanvas.getContext('2d');
const phaseCtx = phaseCanvas.getContext('2d');

function resize() {
  [gainCanvas, phaseCanvas].forEach(c => {
    const rect = c.getBoundingClientRect();
    c.width = rect.width * devicePixelRatio;
    c.height = rect.height * devicePixelRatio;
  });
  draw();
}

// ─── Drawing ──────────────────────────────────────────────────────────────────
function drawPlot(ctx, data, color, yMin, yMax, yLabel, unitLabel, yStep, zeroCrossFreq, phaseAtCross) {
  const W = ctx.canvas.width;
  const H = ctx.canvas.height;
  const dpr = devicePixelRatio;
  const PAD = { l: 72*dpr, r: 16*dpr, t: 12*dpr, b: 36*dpr };
  const plotW = W - PAD.l - PAD.r;
  const plotH = H - PAD.t - PAD.b;

  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // Grid
  const decades = [];
  for (let d = Math.ceil(logFMin()); d <= Math.floor(logFMax()); d++) decades.push(d);

  // vertical grid lines (decades + subdivisions)
  for (let d = Math.floor(logFMin()); d <= Math.ceil(logFMax()); d++) {
    for (let s = 1; s < 10; s++) {
      const f = Math.pow(10, d) * s;
      if (f < state.fMin || f > state.fMax) continue;
      const x = PAD.l + xFromFreq(f, plotW);
      ctx.strokeStyle = s === 1 ? '#d0d5e0' : '#e8eaf0';
      ctx.lineWidth = s === 1 ? 1 : 0.5;
      ctx.beginPath();
      ctx.moveTo(x, PAD.t);
      ctx.lineTo(x, PAD.t + plotH);
      ctx.stroke();
    }
  }

  // horizontal grid lines
  const steps = yStep
    ? (() => { const arr = []; for (let v = yMin; v <= yMax + 0.001; v += yStep) arr.push(v); return arr; })()
    : (() => { const arr = []; const s = (yMax - yMin) / 8; for (let i = 0; i <= 8; i++) arr.push(yMin + i * s); return arr; })();

  for (const yVal of steps) {
    const y = PAD.t + plotH - ((yVal - yMin) / (yMax - yMin)) * plotH;
    ctx.strokeStyle = '#d0d5e0';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PAD.l, y);
    ctx.lineTo(PAD.l + plotW, y);
    ctx.stroke();

    ctx.fillStyle = '#445060';
    ctx.font = `${18*dpr}px JetBrains Mono`;
    ctx.textAlign = 'right';
    ctx.fillText(yVal.toFixed(yVal === Math.round(yVal) ? 0 : 1), PAD.l - 8*dpr, y + 6*dpr);
  }

  // X axis labels
  for (const d of decades) {
    const f = Math.pow(10, d);
    const x = PAD.l + xFromFreq(f, plotW);
    ctx.fillStyle = '#445060';
    ctx.font = `${18*dpr}px JetBrains Mono`;
    ctx.textAlign = 'center';
    const label = d >= 6 ? `${Math.pow(10,d-6)}M` : d >= 3 ? `${Math.pow(10,d-3)}k` : `${f}`;
    ctx.fillText(label + 'Hz', x, PAD.t + plotH + 30*dpr);
  }

  // Zero line for gain
  if (yMin < 0 && yMax > 0) {
    const y0 = PAD.t + plotH - ((0 - yMin) / (yMax - yMin)) * plotH;
    ctx.strokeStyle = '#b0b8cc';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4*dpr, 4*dpr]);
    ctx.beginPath();
    ctx.moveTo(PAD.l, y0);
    ctx.lineTo(PAD.l + plotW, y0);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Draw pole/zero markers on freq axis
  const allPZ = [
    ...state.poles.map(p => ({ ...p, type: 'pole' })),
    ...state.zeros.map(z => ({ ...z, type: 'zero' }))
  ];
  for (const pz of allPZ) {
    const x = PAD.l + xFromFreq(pz.freq, plotW);
    const isSelected = state.selected && state.selected.id === pz.id;
    const c = pz.type === 'pole' ? '#cc1144' : '#1a8c00';
    ctx.fillStyle = c;
    ctx.globalAlpha = isSelected ? 1 : 0.7;
    ctx.beginPath();
    if (pz.type === 'pole') {
      // X marker
      const s = 5*dpr;
      const yy = PAD.t + plotH + 6*dpr;
      ctx.strokeStyle = c;
      ctx.lineWidth = 2*dpr;
      ctx.moveTo(x - s, yy - s);
      ctx.lineTo(x + s, yy + s);
      ctx.moveTo(x + s, yy - s);
      ctx.lineTo(x - s, yy + s);
      ctx.stroke();
    } else {
      // O marker
      const yy = PAD.t + plotH + 6*dpr;
      ctx.arc(x, yy, 4*dpr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // vertical dashed line
    ctx.strokeStyle = pz.type === 'pole' ? 'rgba(204,17,68,0.25)' : 'rgba(26,140,0,0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3*dpr, 4*dpr]);
    ctx.beginPath();
    ctx.moveTo(x, PAD.t);
    ctx.lineTo(x, PAD.t + plotH);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Cursor line
  if (state.cursorX !== null) {
    const f = state.cursorX;
    const x = PAD.l + xFromFreq(f, plotW);
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, PAD.t);
    ctx.lineTo(x, PAD.t + plotH);
    ctx.stroke();
  }

  // Draw curve
  if (data.length > 1) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5 * dpr;
    ctx.lineJoin = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = 8 * dpr;
    ctx.beginPath();
    let started = false;
    for (const [f, val] of data) {
      const x = PAD.l + xFromFreq(f, plotW);
      const y = PAD.t + plotH - ((val - yMin) / (yMax - yMin)) * plotH;
      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }


  // Draw gain annotation point (diamond marker on gain canvas)
  if (ctx === gainCtx) {
    const gp = state.gainPoint;
    const gpX = PAD.l + xFromFreq(1, plotW);  // always at 1Hz
    const { gainDb } = evalTF(1);
    const gpY = PAD.t + plotH - ((gainDb - yMin) / (yMax - yMin)) * plotH;
    const isSelGP = state.gainPointSelected;
    const gpColor = '#0077cc';
    const s = 7 * dpr;

    // Horizontal crosshair line to Y axis only (vertical drag = Y axis readout)
    ctx.strokeStyle = 'rgba(0,119,204,0.22)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3*dpr, 3*dpr]);
    ctx.beginPath();
    ctx.moveTo(PAD.l, gpY);
    ctx.lineTo(gpX, gpY);
    ctx.stroke();
    ctx.setLineDash([]);

    // Vertical tick at 1Hz
    ctx.strokeStyle = 'rgba(0,119,204,0.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3*dpr, 3*dpr]);
    ctx.beginPath();
    ctx.moveTo(gpX, gpY);
    ctx.lineTo(gpX, PAD.t + plotH);
    ctx.stroke();
    ctx.setLineDash([]);

    // Vertical double-arrow marker
    ctx.save();
    ctx.globalAlpha = isSelGP ? 1 : 0.85;
    ctx.fillStyle = isSelGP ? gpColor : 'rgba(0,119,204,0.7)';
    ctx.strokeStyle = isSelGP ? gpColor : 'rgba(0,119,204,0.8)';
    ctx.lineWidth = 2 * dpr;
    ctx.shadowColor = gpColor;
    ctx.shadowBlur = isSelGP ? 10*dpr : 4*dpr;
    const aw = 7 * dpr;   // arrowhead half-width
    const ah = 9 * dpr;   // arrowhead height
    const stem = 10 * dpr; // stem half-length beyond arrowhead base
    // Up arrowhead
    ctx.beginPath();
    ctx.moveTo(gpX, gpY - ah - stem);
    ctx.lineTo(gpX + aw, gpY - stem);
    ctx.lineTo(gpX - aw, gpY - stem);
    ctx.closePath();
    ctx.fill();
    // Down arrowhead
    ctx.beginPath();
    ctx.moveTo(gpX, gpY + ah + stem);
    ctx.lineTo(gpX + aw, gpY + stem);
    ctx.lineTo(gpX - aw, gpY + stem);
    ctx.closePath();
    ctx.fill();
    // Vertical stem connecting the two
    ctx.beginPath();
    ctx.moveTo(gpX, gpY - ah - stem);
    ctx.lineTo(gpX, gpY + ah + stem);
    ctx.stroke();
    // Centre dot
    ctx.beginPath();
    ctx.arc(gpX, gpY, 3.5*dpr, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    // Label: gain dB only (freq fixed at 1Hz)
    const gpLabel = '1 Hz · ' + gainDb.toFixed(1) + ' dB';
    ctx.fillStyle = gpColor;
    ctx.font = `bold ${18*dpr}px JetBrains Mono`;
    ctx.textAlign = 'left';
    ctx.fillText(gpLabel, gpX + 10*dpr, gpY - 6*dpr);
  }

  // Zero-dB crossing vertical line
  if (zeroCrossFreq && zeroCrossFreq >= state.fMin && zeroCrossFreq <= state.fMax) {
    const xcx = PAD.l + xFromFreq(zeroCrossFreq, plotW);

    // Dashed vertical line
    ctx.save();
    ctx.strokeStyle = '#888800';
    ctx.lineWidth = 1.5 * dpr;
    ctx.setLineDash([5*dpr, 4*dpr]);
    ctx.beginPath();
    ctx.moveTo(xcx, PAD.t);
    ctx.lineTo(xcx, PAD.t + plotH);
    ctx.stroke();
    ctx.setLineDash([]);

    // On gain plot: label "0 dB" at top
    if (phaseAtCross === null) {
      ctx.fillStyle = '#888800';
      ctx.font = `bold ${14*dpr}px JetBrains Mono`;
      ctx.textAlign = xcx > PAD.l + plotW * 0.7 ? 'right' : 'left';
      const lx = xcx + (xcx > PAD.l + plotW * 0.7 ? -6*dpr : 6*dpr);
      ctx.fillText('0 dB @ ' + formatFreq(zeroCrossFreq), lx, PAD.t + 18*dpr);
    }

    // On phase plot: dot + label showing phase margin
    if (phaseAtCross !== null) {
      const pm = 180 + phaseAtCross; // phase margin = 180 + phase (phase is negative)
      const pyVal = phaseAtCross;
      const py = PAD.t + plotH - ((pyVal - yMin) / (yMax - yMin)) * plotH;

      // Dot at crossing
      ctx.fillStyle = '#888800';
      ctx.beginPath();
      ctx.arc(xcx, py, 5*dpr, 0, Math.PI * 2);
      ctx.fill();

      // Label: PM only
      ctx.fillStyle = '#888800';
      ctx.font = `bold ${14*dpr}px JetBrains Mono`;
      ctx.textAlign = xcx > PAD.l + plotW * 0.7 ? 'right' : 'left';
      const lx2 = xcx + (xcx > PAD.l + plotW * 0.7 ? -8*dpr : 8*dpr);
      ctx.fillText(`PM=${pm.toFixed(1)}°`, lx2, py - 8*dpr);
    }
    ctx.restore();
  }

  // Axis border
  ctx.strokeStyle = '#c0c8d8';
  ctx.lineWidth = 1;
  ctx.strokeRect(PAD.l, PAD.t, plotW, plotH);
}

function computeData() {
  const N = 400;
  const gainData = [], phaseData = [];
  for (let i = 0; i <= N; i++) {
    const f = Math.pow(10, logFMin() + (i / N) * (logFMax() - logFMin()));
    const { gainDb, phase } = evalTF(f);
    gainData.push([f, gainDb]);
    phaseData.push([f, phase]);
  }
  return { gainData, phaseData };
}

function getYRange(data, margin = 0.12) {
  let mn = Infinity, mx = -Infinity;
  for (const [, v] of data) { mn = Math.min(mn, v); mx = Math.max(mx, v); }
  if (!isFinite(mn)) { mn = -60; mx = 40; }
  const span = Math.max(mx - mn, 10);
  return [mn - span * margin, mx + span * margin];
}

function findZeroCrossing(gainData) {
  // Find frequency where gain crosses 0 dB (last crossing going negative)
  for (let i = 0; i < gainData.length - 1; i++) {
    const [f0, g0] = gainData[i];
    const [f1, g1] = gainData[i + 1];
    if (g0 >= 0 && g1 < 0) {
      // Linear interpolation in log-freq space
      const t = g0 / (g0 - g1);
      return Math.pow(10, Math.log10(f0) + t * (Math.log10(f1) - Math.log10(f0)));
    }
  }
  return null;
}

function draw() {
  const { gainData, phaseData } = computeData();
  const zeroCrossFreq = findZeroCrossing(gainData);
  const phaseAtCross = zeroCrossFreq ? evalTF(zeroCrossFreq).phase : null;
  drawPlot(gainCtx, gainData, '#0077cc', -20, 100, 'Gain', 'dB', 20, zeroCrossFreq, null);
  drawPlot(phaseCtx, phaseData, '#e05000', -180, 90, 'Phase', '°', 45, zeroCrossFreq, phaseAtCross);
  updateSidebar();
}

// ─── Sidebar ──────────────────────────────────────────────────────────────────
function updateSidebar() {
  const list = document.getElementById('pz-list');
  const allPZ = [
    ...state.poles.map(p => ({ ...p, type: 'pole' })),
    ...state.zeros.map(z => ({ ...z, type: 'zero' }))
  ].sort((a, b) => a.freq - b.freq);

  if (allPZ.length === 0) {
    list.innerHTML = '<div class="empty-state">No poles or zeros yet.<br>Click plot or use buttons.</div>';
  } else {
    list.innerHTML = allPZ.map(pz => {
      const fStr = formatFreq(pz.freq);
      const sel = state.selected && state.selected.id === pz.id ? ' selected' : '';
      return `<div class="pz-item${sel}" onclick="selectPZ('${pz.id}','${pz.type}')">
        <div class="pz-dot ${pz.type}"></div>
        <span class="pz-freq">${fStr}</span>
        <span class="pz-type">${pz.type}</span>
        <button class="pz-delete" onclick="event.stopPropagation();removePZ('${pz.id}','${pz.type}')">×</button>
      </div>`;
    }).join('');
  }

  document.getElementById('info-poles').textContent = state.poles.length;
  document.getElementById('info-zeros').textContent = state.zeros.length;

  const dc = evalTF(0.001);
  document.getElementById('info-dcgain').textContent = dc.gainDb.toFixed(1) + ' dB';
  // Compute phase margin from zero-crossing
  const { gainData: _gd } = computeData();
  const _zcf = findZeroCrossing(_gd);
  if (_zcf) {
    const _pm = 180 + evalTF(_zcf).phase;
    document.getElementById('info-pm').textContent = _pm.toFixed(1) + '°';
  } else {
    document.getElementById('info-pm').textContent = '—';
  }
}

function formatFreq(f) {
  if (f >= 1e6) return (f / 1e6).toFixed(3).replace(/\.?0+$/, '') + ' MHz';
  if (f >= 1e3) return (f / 1e3).toFixed(3).replace(/\.?0+$/, '') + ' kHz';
  return f.toFixed(1).replace(/\.?0+$/, '') + ' Hz';
}

function selectPZ(id, type) {
  const arr = type === 'pole' ? state.poles : state.zeros;
  const item = arr.find(x => String(x.id) === String(id));
  state.selected = item ? { ...item, type } : null;
  draw();
}

function removePZ(id, type) {
  if (type === 'pole') state.poles = state.poles.filter(p => String(p.id) !== String(id));
  else state.zeros = state.zeros.filter(z => String(z.id) !== String(id));
  if (state.selected && String(state.selected.id) === String(id)) state.selected = null;
  draw();
}

function addFromSidebar(type) {
  const val = parseFloat(document.getElementById('add-freq').value);
  const unit = parseFloat(document.getElementById('add-unit').value);
  if (!isFinite(val) || val <= 0) return;
  const freq = val * unit;
  const item = { id: newId(), freq };
  if (type === 'pole') state.poles.push(item);
  else state.zeros.push(item);
  state.selected = { ...item, type };
  draw();
}

// ─── Mouse interaction ────────────────────────────────────────────────────────
let activeMode = null; // 'pole' | 'zero' set by keyboard

// Drag state
const drag = {
  active: false,
  id: null,
  type: null,
  startX: 0,
  moved: false,
};

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'p' || e.key === 'P') { activeMode = 'pole'; document.body.style.cursor = 'crosshair'; }
  if (e.key === 'z' || e.key === 'Z') { activeMode = 'zero'; document.body.style.cursor = 'crosshair'; }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (state.selected) {
      removePZ(state.selected.id, state.selected.type);
      state.selected = null;
    }
  }
});

document.addEventListener('keyup', e => {
  if (e.key === 'p' || e.key === 'P' || e.key === 'z' || e.key === 'Z') {
    activeMode = null;
    if (!drag.active) document.body.style.cursor = '';
  }
});

function getPlotMetrics(canvas) {
  const dpr = devicePixelRatio;
  const PAD_L = 52 * dpr;
  const PAD_R = 16 * dpr;
  const plotW = canvas.width - PAD_L - PAD_R;
  return { dpr, PAD_L, PAD_R, plotW };
}

function getCanvasFreq(canvas, e) {
  const rect = canvas.getBoundingClientRect();
  const { dpr, PAD_L, plotW } = getPlotMetrics(canvas);
  const xPixel = (e.clientX - rect.left) * dpr;
  const xInPlot = xPixel - PAD_L;
  if (xInPlot < 0 || xInPlot > plotW) return null;
  return freqFromX(xInPlot, plotW);
}


function findGainPoint(canvas, e) {
  if (canvas !== gainCanvas) return false;
  const dpr = devicePixelRatio;
  const PAD_L = 52 * dpr;
  const PAD_R = 16 * dpr;
  const PAD_T = 12 * dpr;
  const PAD_B = 28 * dpr;
  const plotW = canvas.width - PAD_L - PAD_R;
  const plotH = canvas.height - PAD_T - PAD_B;
  const rect = canvas.getBoundingClientRect();

  // Gain point is always at freq=1Hz; compute its pixel position
  const gpX = PAD_L + xFromFreq(1, plotW);
  const { gainDb } = evalTF(1);
  const GAIN_Y_MIN = -20, GAIN_Y_MAX = 100;
  const gpY = PAD_T + plotH - ((gainDb - GAIN_Y_MIN) / (GAIN_Y_MAX - GAIN_Y_MIN)) * plotH;

  const mouseX = (e.clientX - rect.left) * dpr;
  const mouseY = (e.clientY - rect.top) * dpr;

  const dx = Math.abs(mouseX - gpX);
  const dy = Math.abs(mouseY - gpY);
  return dx < 20 && dy < 14;
}

function findNearest(canvas, f) {
  const { plotW } = getPlotMetrics(canvas);
  const clickX = xFromFreq(f, plotW);
  const TOL = 12; // pixels in plot space
  let nearest = null, nearDist = Infinity;
  for (const p of state.poles) {
    const d = Math.abs(xFromFreq(p.freq, plotW) - clickX);
    if (d < TOL && d < nearDist) { nearest = { ...p, type: 'pole' }; nearDist = d; }
  }
  for (const z of state.zeros) {
    const d = Math.abs(xFromFreq(z.freq, plotW) - clickX);
    if (d < TOL && d < nearDist) { nearest = { ...z, type: 'zero' }; nearDist = d; }
  }
  return nearest;
}

function updatePZFreq(id, type, freq) {
  const arr = type === 'pole' ? state.poles : state.zeros;
  const item = arr.find(x => String(x.id) === String(id));
  if (item) {
    item.freq = Math.max(state.fMin, Math.min(state.fMax, freq));
    if (state.selected && String(state.selected.id) === String(id)) {
      state.selected = { ...item, type };
    }
  }
}

function onCanvasMouseDown(e) {
  if (e.button !== 0) return;
  const canvas = e.currentTarget;
  const f = getCanvasFreq(canvas, e);
  if (!f) return;

  // Check gain annotation point first (gain canvas only)
  if (!activeMode && findGainPoint(canvas, e)) {
    drag.active = true;
    drag.id = 'gainPoint';
    drag.type = 'gainPoint';
    drag.moved = false;
    drag.canvas = canvas;
    drag.startY = e.clientY;
    state.gainPointSelected = true;
    state.selected = null;
    document.body.style.cursor = 'ns-resize';
    e.preventDefault();
    draw();
    return;
  }

  const nearest = findNearest(canvas, f);
  if (nearest && !activeMode) {
    // Start drag
    drag.active = true;
    drag.id = nearest.id;
    drag.type = nearest.type;
    drag.startX = e.clientX;
    drag.moved = false;
    drag.canvas = canvas;
    state.selected = nearest;
    document.body.style.cursor = 'ew-resize';
    e.preventDefault();
    draw();
  }
}

function onGlobalMouseMove(e) {
  if (!drag.active) {
    // Normal hover — update cursor display on whichever canvas is active
    return;
  }
  const canvas = drag.canvas;
  const f = getCanvasFreq(canvas, e);
  if (f) {
    drag.moved = true;
    if (drag.type === 'gainPoint') {
      // Vertical drag: map mouse Y to gain dB, then back-solve K
      const canvas = drag.canvas;
      const dpr = devicePixelRatio;
      const PAD_T = 12 * dpr;
      const PAD_B = 28 * dpr;
      const plotH = canvas.height - PAD_T - PAD_B;
      const rect = canvas.getBoundingClientRect();
      const mouseY = (e.clientY - rect.top) * dpr;
      const GAIN_Y_MIN = -20, GAIN_Y_MAX = 100;
      // invert: y = PAD_T + plotH - ((val - yMin)/(yMax-yMin))*plotH
      const newGainDb = GAIN_Y_MAX - ((mouseY - PAD_T) / plotH) * (GAIN_Y_MAX - GAIN_Y_MIN);
      const clampedDb = Math.max(GAIN_Y_MIN, Math.min(GAIN_Y_MAX, newGainDb));
      // The TF at 1Hz already includes pole/zero shape; we want to set K so that gain@1Hz = clampedDb
      // TF(1Hz) with K=1: compute shape gain, then K = 10^(clampedDb/20) / shapeGain
      const K_old = parseFloat(document.getElementById('dc-gain').value) || 1;
      // eval with K=1 to get shape
      document.getElementById('dc-gain').value = 1;
      const { gainDb: shapeDb } = evalTF(1);
      const shapeLinear = Math.pow(10, shapeDb / 20);
      const targetLinear = Math.pow(10, clampedDb / 20);
      const newK = targetLinear / shapeLinear;
      document.getElementById('dc-gain').value = newK.toFixed(6);
      document.getElementById('cursor-display').innerHTML =
        `1 Hz<br><span class="gain-color">${clampedDb.toFixed(1)} dB</span>`;
    } else {
      updatePZFreq(drag.id, drag.type, f);
      const { gainDb, phase } = evalTF(f);
      document.getElementById('cursor-display').innerHTML =
        `${formatFreq(f)}<br><span class="gain-color">${gainDb.toFixed(2)} dB</span> &nbsp; <span class="phase-color">${phase.toFixed(1)}°</span>`;
    }
    draw();
  }
}

function onGlobalMouseUp(e) {
  if (!drag.active) return;
  drag.active = false;
  state.gainPointSelected = false;
  document.body.style.cursor = activeMode ? 'crosshair' : '';
  draw();
}

document.addEventListener('mousemove', onGlobalMouseMove);
document.addEventListener('mouseup', onGlobalMouseUp);

function onCanvasClick(e) {
  if (drag.moved) { drag.moved = false; return; } // was a drag, not a click

  const canvas = e.currentTarget;
  const f = getCanvasFreq(canvas, e);
  if (!f) return;

  const nearest = findNearest(canvas, f);

  if (nearest && !activeMode) {
    state.selected = nearest;
    draw();
    return;
  }

  // Place new via keyboard mode
  if (activeMode) {
    const item = { id: newId(), freq: f };
    if (activeMode === 'pole') state.poles.push(item);
    else state.zeros.push(item);
    state.selected = { ...item, type: activeMode };
    draw();
    return;
  }

  state.selected = null;
  state.gainPointSelected = false;
  draw();
}

function onCanvasMove(e) {
  if (drag.active) return; // handled globally
  const canvas = e.currentTarget;
  const f = getCanvasFreq(canvas, e);
  state.cursorX = f;

  // Update cursor style based on hover
  if (f) {
    const nearest = findNearest(canvas, f);
    const nearGP = findGainPoint(canvas, e);
    if (nearGP) canvas.style.cursor = 'ns-resize';
    else if (nearest) canvas.style.cursor = 'ew-resize';
    else canvas.style.cursor = activeMode ? 'crosshair' : 'default';

    const { gainDb, phase } = evalTF(f);
    document.getElementById('cursor-display').innerHTML =
      `${formatFreq(f)}<br><span class="gain-color">${gainDb.toFixed(2)} dB</span> &nbsp; <span class="phase-color">${phase.toFixed(1)}°</span>`;
  } else {
    canvas.style.cursor = 'default';
    document.getElementById('cursor-display').textContent = '—';
  }
  draw();
}

function onCanvasLeave() {
  if (drag.active) return;
  state.cursorX = null;
  document.getElementById('cursor-display').textContent = '—';
  draw();
}

[gainCanvas, phaseCanvas].forEach(c => {
  c.addEventListener('mousedown', onCanvasMouseDown);
  c.addEventListener('click', onCanvasClick);
  c.addEventListener('mousemove', onCanvasMove);
  c.addEventListener('mouseleave', onCanvasLeave);
});

// DC gain live update
document.getElementById('dc-gain').addEventListener('input', draw);

// ─── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('resize', resize);

// Default setup matching reference image
state.poles.push({ id: newId(), freq: 1 });        // pole @ 1Hz
state.zeros.push({ id: newId(), freq: 100 });       // zero @ 100Hz
state.zeros.push({ id: newId(), freq: 9059 });      // zero @ ~9.059kHz
state.poles.push({ id: newId(), freq: 11012 });     // pole @ ~11.012kHz
state.poles.push({ id: newId(), freq: 100000 });    // pole @ 100kHz
document.getElementById('dc-gain').value = '1000';

setTimeout(() => { resize(); }, 50);
</script>
</body>
